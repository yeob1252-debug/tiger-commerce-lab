<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사장님 대시보드 | 타이거커머스랩</title>
<meta name="robots" content="noindex, nofollow">
<base href="/">
<link rel="icon" type="image/png" href="assets/characters/logo.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash-body">

<header class="dash-header">
  <a href="/" class="dash-header-brand">
    <span class="brand-mark">
      <img class="brand-mark-img" src="assets/characters/logo.png" alt="타이거커머스랩 로고">
    </span>
    <span class="dash-store-name" id="storeNameLabel">타이거커머스랩</span>
  </a>
  <button type="button" class="dash-logout" id="logoutBtn">로그아웃</button>
</header>

<main class="dash-main">
  <div class="dash-loading" id="dashLoading">대시보드를 불러오는 중입니다...</div>

  <div id="dashContent" hidden>

    <section class="dash-section">
      <div class="dash-card">
        <div class="dash-progress-row">
          <span class="dash-progress-label">계약 진행률</span>
          <span class="dash-progress-pct" id="progressPct">0%</span>
        </div>
        <div class="dash-progress-track"><div class="dash-progress-fill" id="progressFill"></div></div>
      </div>
    </section>

    <section class="dash-section">
      <div class="dash-scorecards" id="scorecards"></div>
    </section>

    <section class="dash-section">
      <h2 class="dash-section-title"><span class="dash-section-icon" aria-hidden="true">🚀</span> 진행 단계</h2>
      <div class="dash-card">
        <div class="dash-phases" id="phasesWrap"></div>
      </div>
    </section>

    <section class="dash-section">
      <h2 class="dash-section-title"><span class="dash-section-icon" aria-hidden="true">📈</span> 월간 성과</h2>
      <div class="dash-card">
        <div class="dash-chart-tabs" id="chartTabs">
          <button type="button" class="dash-chart-tab is-active" data-metric="조회수">조회수</button>
          <button type="button" class="dash-chart-tab" data-metric="매출">매출</button>
          <button type="button" class="dash-chart-tab" data-metric="ROAS">ROAS</button>
        </div>
        <div class="dash-chart-canvas-wrap"><canvas id="monthlyChart"></canvas></div>
        <button type="button" class="dash-table-toggle" id="rawTableToggle">
          원본 데이터 보기 <span class="dash-table-toggle-arrow" aria-hidden="true">▾</span>
        </button>
        <div class="dash-raw-table-wrap" id="rawTableWrap">
          <table class="dash-table" id="monthlyTable"></table>
        </div>
      </div>
    </section>

    <section class="dash-section">
      <h2 class="dash-section-title"><span class="dash-section-icon" aria-hidden="true">📅</span> 운영 캘린더</h2>
      <div class="dash-card" id="calendarWrap"></div>
    </section>

    <section class="dash-section">
      <h2 class="dash-section-title"><span class="dash-section-icon" aria-hidden="true">🍽️</span> 메뉴 단가표</h2>
      <div class="dash-card">
        <table class="dash-table dash-menu-table" id="menuTable"></table>
      </div>
    </section>

    <section class="dash-section">
      <h2 class="dash-section-title"><span class="dash-section-icon" aria-hidden="true">💬</span> 소통 게시판</h2>
      <div class="dash-card">
        <form class="dash-board-form" id="boardForm">
          <textarea class="dash-board-input" id="boardInput" rows="1" placeholder="궁금한 점이나 하고 싶은 말을 남겨주세요"></textarea>
          <button type="submit" class="btn btn-primary dash-board-submit">등록</button>
        </form>
        <div class="dash-board-list" id="boardList"></div>
      </div>
    </section>

  </div>
</main>

<script>

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/dashboard-common.js"></script>
<script src="js/client.js"></script>
</body>
</html>
