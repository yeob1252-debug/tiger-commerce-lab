<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사장님 로그인 | 타이거커머스랩</title>
<meta name="robots" content="noindex, nofollow">
<base href="/">
<link rel="icon" type="image/png" href="assets/brand/logo/TIGER_LOGO_SYMBOL_V1.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="login-body">

<main class="login-wrap">
  <div class="login-card">
    <a href="/" class="login-brand">
      <img class="brand-logo" src="assets/brand/logo/TIGER_LOGO_PRIMARY_HORIZONTAL_V1.png" alt="TIGER COMMERCE LAB">
      <img class="brand-logo-symbol" src="assets/brand/logo/TIGER_LOGO_SYMBOL_V1.png" alt="TIGER COMMERCE LAB">
    </a>
    <h1 class="login-title">사장님 로그인</h1>
    <p class="login-sub">매장 대시보드에 오신 것을 환영합니다</p>

    <form id="loginForm" class="login-form" novalidate>
      <div class="login-field">
        <label for="storeName">매장명</label>
        <input type="text" id="storeName" name="storeName" placeholder="계약 시 등록한 매장명" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
      </div>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-large login-submit">
        <span class="btn-label">로그인</span>
      </button>
    </form>
  </div>
</main>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_K4gtBbMUqfh2c0h4qBb8Q9CJNO1w35e0RhcQVwWkVeZPtEdmXOoEHit886CVDvGAXg/exec';
</script>
<script src="js/dashboard-common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
